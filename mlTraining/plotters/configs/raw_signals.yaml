# Override any LabelConfig field here; the rest come from config.py defaults.
# Only used when a panel below has source: labels. Omit the block entirely
# to use all defaults.
labels_config:
  assist_delay_ms: 100
  assist_window_ms: 600
  turn_delay_ms: 200
  turn_window_ms: 2000

plots:
  - title: "Paddle Accel (oar IMU)"
    source: rf
    signals: [accel_x, accel_y, accel_z]
    ylabel: "m/s^2"

  - title: "Paddle Gyro (oar IMU)"
    source: rf
    signals: [gyro_x, gyro_y, gyro_z]
    ylabel: "rad/s"

  - title: "Kayak Accel"
    source: imu
    signals: [accel_x, accel_y, accel_z]
    ylabel: "m/s^2"

  - title: "Kayak Gyro"
    source: imu
    signals: [gyro_x, gyro_y, gyro_z]
    ylabel: "rad/s"

  # Comment in to overlay the regression labels (future-window means of
  # kayak signal). Requires the labels_config block above.
  - title: "Computed Labels"
    source: labels
    signals: [assist_label, turn_label]

