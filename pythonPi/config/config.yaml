---
boatManager:
  # CPU cores the main process (RF + Motor + IMU threads) is allowed to run on.
  # Pi 5 has 4 cores (0–3). ML gets the other pair via mlManager.cpuAffinity.
  cpuAffinity: [0, 1, 2]
rfManager:
  rfReadDataRateInMilliseconds: 10
  rfWriteDataRateInMilliseconds: 100
  rfLoggerVerbosityLevel: DEBUG
  rfLoggerFilePath: /home/bradensunwold/Documents/e-kayak/pythonPi/logs/rfLog.txt
motorManager:
  motorCommandReadRateInMilliseconds: 50
  motorWriteRateInMilliseconds: 50   # Command motor at 20Hz for future controls
  motorReadRateInMilliseconds: 200     # Read faults and battery level back from the motor at 5hz
  startupReverseTimeInMilliseconds: 7000
  # maxCurrentInMilliAmps: 12000
  numberOfSpeedSettings: 4
  # speedSettingToCurrentMapInPercent: # Number of elements here has to match numberOfSpeedSettings
  #   - SpeedOne: 40.0
  #   - SpeedTwo: 60.0
  #   - SpeedThree: 90.0
  vescEnableGpioPin: 18
  motorPolePairs: 6
  maxRpms: 2145 # 2145 corresponds to about 65% duty cycle and 12A current draw - 500 for testing
  speedSettingToRpmMapInPercent: # Number of elements here has to match numberOfSpeedSettings
    - 0.0
    - 60.0
    - 80.0
    - 98.0
  underVoltage: 20
  batteryCalibrationOffset: .8    # VESC battery monitor ~.7 - .8V off from measured battery voltage
  maxTemp: 53

  faultClearTimeoutInMilliseconds: 2500   # How long does fault have to be cleared to unlatch
  vescComsLossTimeoutInMilliseconds: 3000  # Fault if no VESC response for this long
  oarComsLossTimeoutInMilliseconds: 3000   # Fault if no fresh oar packets for this long (silent radio or frozen message index)
  maxRpmReduction: 250                     # Max total RPM reduction from over-current recoveries before latching
  faultConfig:
    overTemp:
      latching: false
    overCurrent:
      latching: false
    underVoltage:
      latching: false
    comsLoss:
      latching: false
    vescComsLoss:
      latching: true
    unknown:
      latching: true
  rpmFilterTauInSeconds: 1.3       # RC filter time constant for RPM rate limiter (manual mode)
  autoMode:
    deadbandRpm: 725                # 750 RPM held between strokes (keeps motor spinning) - 300 for testing
    assistMaxRpm: 1420              # 1300 RPM added on top of deadband at full assist (clamped prediction = 1.0) - 200 for testing
    assistGain: 1.0                 # Tuning gain on the assist prediction before clamping to [0, 1]
    rampUpTauInSeconds: 0.2          # RC filter tau when target RPM is rising
    rampDownTauInSeconds: 0.2        # RC filter tau when target RPM is falling ("sustain vs pulse" decay knob)
  finController:
    controlRateInMilliseconds: 100
    pitchDeadbandDeg: 12.0
    openLoopGain: 2.0             # Fin degrees per degree of oar pitch
    maxFinAngleDeg: 25.0          # Max fin deflection in degrees (±30)
    servoGpioPin: 12
    finFilterTauInSeconds: 0.2    # RC filter time constant for smoothing fin angle commands
    headingPid:
      kP: 1.3
      kI: 0.25
      kD: 0.1
      integralLimit: 9.0
      outputMinDeg: -25.0
      outputMaxDeg: 25.0
  motorLoggerVerbosityLevel: DEBUG
  motorLoggerFilePath: /home/bradensunwold/Documents/e-kayak/pythonPi/logs/motorLog.txt
imuManager:
  i2cBus: 3
  calibrationFilePath: /home/bradensunwold/Documents/e-kayak/pythonPi/config/bno055_calibration.json
  imuReadRateInMilliseconds: 50
  imuReadDropThresholdHz: 17.0
  imuLoggerVerbosityLevel: DEBUG
  imuLoggerFilePath: /home/bradensunwold/Documents/e-kayak/pythonPi/logs/imuLog.txt
mlManager:
  # Artifact paths are resolved relative to pythonPi/ at runtime
  assistModelPath: ../mlTraining/checkpoints/assist_best.onnx
  assistModelMetaPath: ../mlTraining/checkpoints/assist_onnx_meta.json
  assistNormStatsPath: ../mlTraining/checkpoints/assist_norm_stats.json
  # Emit an INFO prediction line every N samples (DEBUG level still fires every sample)
  inferenceLogIntervalSamples: 5
  # CPU cores the ML process is pinned to. Keeps inference off the cores
  # the main process (RF/Motor/IMU) is scheduling work on.
  cpuAffinity: [3]
  mlLoggerVerbosityLevel: DEBUG
  mlLoggerFilePath: /home/bradensunwold/Documents/e-kayak/pythonPi/logs/mlLog.txt
